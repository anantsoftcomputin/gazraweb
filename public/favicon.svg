<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    @media (prefers-reduced-motion: reduce) {
      .orbit, .spark { animation: none; }
    }

    .orbit {
      transform-origin: 32px 32px;
      animation: orbit 5.5s linear infinite;
    }

    .spark {
      transform-origin: 32px 32px;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes orbit {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: .55; transform: scale(.92); }
      50% { opacity: 1; transform: scale(1.08); }
    }
  </style>

  <rect width="64" height="64" rx="16" fill="#fbf4e7"/>
  <circle cx="32" cy="32" r="21" fill="#fff8e8" stroke="#decba7" stroke-width="2"/>
  <path d="M21 38c4.4 5.2 14.2 5.3 18.9.4 2.8-2.9 2.5-7.4-.8-9.9-3.2-2.4-8.9-1.3-10.9 2.4" fill="none" stroke="#171311" stroke-width="4" stroke-linecap="round"/>
  <path d="M42.5 23.5c-4.1-3.6-11.9-3.4-15.9.8" fill="none" stroke="#9f2f28" stroke-width="4" stroke-linecap="round"/>

  <g class="orbit">
    <ellipse cx="32" cy="32" rx="25" ry="12" fill="none" stroke="#2f6b45" stroke-width="1.5" opacity=".34"/>
    <circle class="spark" cx="55" cy="32" r="3.2" fill="#d9a13a"/>
  </g>
  <circle cx="32" cy="32" r="3.5" fill="#2f6b45"/>
</svg>
